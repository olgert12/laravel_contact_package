name: Build AlbTV APK

on:
  workflow_dispatch:
  push:
    branches: [albtv-apk-build]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip albtv build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Commit built APK
        run: |
          mkdir -p built
          cp app/build/outputs/apk/debug/app-debug.apk built/AlbTV-MVP-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f built/AlbTV-MVP-debug.apk
          git commit -m "[skip albtv build] Store built AlbTV APK"
          git push
